<svg xmlns="http://www.w3.org/2000/svg" width="360" height="108" viewBox="0 0 360 108" role="img" aria-labelledby="title description">
  <title id="title">Pubesto</title>
  <desc id="description">Pubesto e-commerce logo with a shopping bag and check mark</desc>

  <defs>
    <linearGradient id="shell" x1="24" y1="12" x2="336" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F8FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="38" y1="28" x2="94" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7357FF"/>
      <stop offset="0.5" stop-color="#4F6FFF"/>
      <stop offset="1" stop-color="#19B8FF"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="111" y1="37" x2="255" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161A2B"/>
      <stop offset="1" stop-color="#343B59"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF6B55"/>
    </linearGradient>
    <filter id="shellShadow" x="-15%" y="-30%" width="130%" height="170%">
      <feDropShadow dx="0" dy="11" stdDeviation="11" flood-color="#5364A5" flood-opacity="0.18"/>
    </filter>
    <filter id="markShadow" x="-35%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#5367F5" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect x="18" y="13" width="324" height="82" rx="25" fill="url(#shell)" filter="url(#shellShadow)"/>
  <rect x="18.75" y="13.75" width="322.5" height="80.5" rx="24.25" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>

  <g filter="url(#markShadow)">
    <rect x="36" y="27" width="56" height="56" rx="17" fill="url(#brand)"/>
    <path d="M50.5 46.5h27l-2.4 24H52.9l-2.4-24Z" fill="#FFFFFF" fill-opacity="0.98"/>
    <path d="M57 47v-2.5a7 7 0 0 1 14 0V47" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
    <path d="m58.5 58.5 4.3 4.2 7.8-8.4" fill="none" stroke="#5368F7" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="82.5" cy="37.5" r="6.5" fill="url(#accent)"/>
    <path d="M82.5 34.4v6.2M79.4 37.5h6.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <g>
    <text
      x="111"
      y="64"
      fill="url(#wordmark)"
      font-family="Inter, Manrope, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
      font-size="30"
      font-weight="850"
      letter-spacing="-1.25"
    >Pubesto</text>
    <circle cx="221.5" cy="59.5" r="3.4" fill="url(#accent)"/>
    <text
      x="112"
      y="77"
      fill="#667093"
      font-family="Inter, Manrope, ui-sans-serif, system-ui, sans-serif"
      font-size="7.2"
      font-weight="750"
      letter-spacing="2.15"
    >SHOP SMARTER</text>
  </g>

  <g transform="translate(255 40)">
    <rect width="65" height="27" rx="13.5" fill="#EEF1FF"/>
    <path d="M13 13.5h8M17 9.5v8" stroke="#586AF5" stroke-width="1.8" stroke-linecap="round"/>
    <text
      x="27"
      y="17.5"
      fill="#5363D8"
      font-family="Inter, Manrope, ui-sans-serif, system-ui, sans-serif"
      font-size="9.5"
      font-weight="800"
      letter-spacing="0.7"
    >STORE</text>
  </g>
</svg>
